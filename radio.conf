# Driver-Station radio / link configuration  --  ExpressLRS TX module settings
#
# These are pushed to the ELRS module (e.g. RadioMaster Nano) over CRSF when the
# backend starts and again whenever you save this file. The backend pings the
# module, walks its parameter menu, matches each setting below by NAME, and
# writes the chosen option. A setting you leave out (or comment) is left
# untouched on the module.
#
# One setting per line:   key = value     ('#' starts a comment)
#
#   packet_rate     = 50 | 100 | 150 | 250 | 333 | 500 ...   (Hz; module-dependent)
#                     or a dynamic/forced label your module lists: D250, D500, F500, F1000
#   power           = 10 | 25 | 50 | 100 | 250 ...           (mW)   [25 = safe default]
#   telemetry_ratio = off | 1:128 | 1:64 | 1:32 | 1:16 | 1:8 | 1:4 | 1:2 | std
#   switch_mode     = hybrid | wide
#   fec             = on | off            (only if your module exposes an "FEC" field)
#
# Values are matched loosely against YOUR module's own option lists (case- and
# unit-insensitive, so `250` matches `250Hz` and `25` matches `25 mW`). If a
# value isn't offered, the backend prints the options it actually saw so you can
# pick a valid one. Nothing is sent if the module doesn't answer the ping.

power           = 25       # start low; raise once the link is verified
packet_rate     = 250
telemetry_ratio = 1:128
switch_mode     = wide
# fec           = on
