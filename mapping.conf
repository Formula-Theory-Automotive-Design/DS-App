# Driver-Station channel mapping  --  EDIT THIS FILE TO CHANGE WHAT EACH AXIS DOES
#
# It is hot-reloaded: save the file and the running backend picks up the change
# instantly (no rebuild, no restart). A bad edit is ignored (the previous good
# mapping keeps running) and an error is printed to the backend's console.
#
# One rule per line:   chN = <expr>     ('#' starts a comment)
#
#   axisK    raw axis K, -1..1                       (steering wheel, sticks)
#   pedalK   axis K read as a pedal:  released -> 0, fully pressed -> 1
#   buttonK  0 or 1
#   <number> a scalar offset, e.g.  + 0.1   (normalized: 1.0 == full travel)
#   center | min | max | <number 172..1811>          a fixed channel value
#                                                     (must be the whole line)
#
# Any axis/pedal/button term can take a factor and/or a clamp:
#   0.5*axis0                scale a term (gain / rate)
#   clamp(axis0,-0.5,0.5)    limit a term's travel
#   2*clamp(axis0,-0.5,0.5)  clamp first, then scale
#
# Terms combine with + and - .  The summed result is centered on 992:
#     0 -> 992 (center),  +1 -> 1811 (full),  -1 -> 172 (full other way)
# Reverse anything by negating it.
#
# chN is the CRSF channel index (0-based): ch0 = receiver output 1,
# ch1 = output 2, and so on.
#
# To find your axis numbers, run the backend with the wheel plugged in and watch
# the "Controls" card in the frontend (or `jstest /dev/input/js0`) while you turn
# the wheel and press each pedal.

# --- Logitech G920 (verify the pedal axis numbers on your machine!) ----------
ch0 = clamp(axis0,-0.4,0.4)   # steering           -> receiver output 1
ch1 = pedal1 - pedal2    # accelerator(axis1) minus brake(axis2) -> output 2 (fwd/rev)

# --- handy variants: uncomment / edit instead of the lines above -------------
# ch0 = -axis0                  # reverse steering
# ch0 = 0.5*axis0               # gentler steering (half rate)
# ch0 = axis0 + 0.05            # steering with a small trim to the right
# ch0 = clamp(axis0,-0.5,0.5)   # limit steering to half travel
# ch1 = pedal2 - pedal1         # reverse throttle (swap accelerator / brake)
# ch2 = button0                 # a button on an aux channel (output 3)
# ch3 = center                  # hold an aux channel at neutral
